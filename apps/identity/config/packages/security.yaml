security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto
    providers:
        identity_user_provider:
            entity: { class: App\Identity\Main\Entity\User, property: email }
    firewalls:
        api:
            pattern: ^/api
            stateless: true
            provider: identity_user_provider
            custom_authenticators: [App\Identity\Main\Security\JwtAuthenticator]
    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/wechat/miniapp/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/wechat/oauth, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
