framework:
    messenger:
        failure_transport: failed
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                serializer: messenger.transport.native_php_serializer
            failed:
                dsn: 'doctrine://default?queue_name=failed'
                serializer: messenger.transport.native_php_serializer
        default_bus: messenger.bus.default
        buses:
            messenger.bus.default: []
        routing:
            CrudPlatform\IntegrationContracts\Event\V1\TradeOrderCreated: async
            CrudPlatform\IntegrationContracts\Event\V1\TradeOrderCancelled: async
            CrudPlatform\IntegrationContracts\Event\V1\StoreOrderAccepted: async
            CrudPlatform\IntegrationContracts\Event\V1\StoreOrderRejected: async
            CrudPlatform\IntegrationContracts\Event\V1\StoreDirectoryUpserted: async
            CrudPlatform\IntegrationContracts\Event\V1\PaymentInvoicePaid: async
            CrudPlatform\IntegrationContracts\Event\V1\PaymentInvoiceFailed: async
            CrudPlatform\IntegrationContracts\Event\V1\PaymentInvoiceCancelled: async
            CrudPlatform\IntegrationContracts\Event\V1\PaymentInvoiceRefunded: async
