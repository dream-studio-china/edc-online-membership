doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            Trade:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Trade/Entity'
                prefix: 'App\Trade\Entity'
                alias: Trade
            Promotion:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Promotion/Entity'
                prefix: 'App\Promotion\Entity'
                alias: Promotion
            Payment:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/vendor/crud-platform/payment-app/src/Entity'
                prefix: 'App\Payment\Entity'
                alias: Payment

when@test:
    doctrine:
        dbal:
            url: 'sqlite:///%kernel.project_dir%/var/trade_test.db'
