doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        mappings:
            Store:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Store\Entity'
                alias: Store

when@test:
    doctrine:
        dbal:
            url: 'sqlite:///%kernel.project_dir%/var/store_test.db'
