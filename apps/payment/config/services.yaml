parameters:
    payment.system_wallet_id: 0
    wechat.pay.notify_url: '%env(WECHAT_PAY_NOTIFY_URL)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Core\Controller\RestController:
            calls:
                - [ setRequestStack, [ '@request_stack' ] ]
                - [ setSerializer, [ '@serializer' ] ]
                - [ setTranslator, [ '@translator' ] ]
                - [ setServiceContainer, [ '@service_container' ] ]
        App\Payment\Service\PaymentGatewayInterface:
            tags: ['payment.gateway']
        App\Payment\Service\Adjustment\PaymentAdjustmentProviderInterface:
            tags: ['payment.adjustment_provider']

    App\Payment\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Core\:
        resource: '%kernel.project_dir%/vendor/crud-platform/platform-kernel/src/'
        exclude:
            - '%kernel.project_dir%/vendor/crud-platform/platform-kernel/src/Serializer/Normalizer/FlatNormalizer.php'
            - '%kernel.project_dir%/vendor/crud-platform/platform-kernel/src/EventListener/*'

    App\Core\EventListener\ExceptionInterceptor:
        tags:
            - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }
        arguments:
            $translator: '@translator'
            $logger: '@logger'
            $env: '%kernel.environment%'

    App\Core\EventListener\ControllerListener:
        tags:
            - { name: kernel.event_listener, event: kernel.controller, method: onKernelController }
        arguments:
            $tokenStorage: '@security.token_storage'
            $logger: '@logger'

    App\Core\Service\ServiceLocatorInterface: '@App\Core\Service\DefaultServiceLocator'
    App\Payment\Service\PayerReferenceResolverInterface: '@App\Payment\Service\PayerDirectoryReferenceResolver'
    App\Payment\Bridge\Wechat\WechatPayerOpenIdResolverInterface: '@App\Payment\Bridge\Wechat\UnavailableWechatPayerOpenIdResolver'
    App\Payment\Bridge\Wallet\WalletBalanceAdjustmentPortInterface: '@App\Payment\Bridge\Wallet\UnavailableWalletBalanceAdjustmentPort'
    CrudPlatform\IntegrationContracts\Wallet\WalletTransferPortInterface: '@App\Payment\Bridge\Wallet\UnavailableWalletTransferPort'

    App\Payment\Service\Gateway\WechatPayService:
        arguments:
            $miniappAppId: '%env(WECHAT_MINIAPP_APP_ID)%'
            $miniappSecret: '%env(WECHAT_MINIAPP_SECRET)%'
            $payMchId: '%env(WECHAT_PAY_MCH_ID)%'
            $paySecretKey: '%env(WECHAT_PAY_SECRET_KEY)%'
            $payPrivateKeyPath: '%env(WECHAT_PAY_PRIVATE_KEY)%'
            $payCertificatePath: '%env(WECHAT_PAY_CERTIFICATE)%'
            $payPlatformCertPath: '%env(WECHAT_PAY_PLATFORM_CERT)%'
            $payPubKeyId: '%env(WECHAT_PAY_PUB_KEY_ID)%'
            $payPubKeyPath: '%env(WECHAT_PAY_PUB_KEY_PATH)%'

    Nyholm\Psr7\Factory\Psr17Factory: ~
    Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory:
        arguments: ['@Nyholm\Psr7\Factory\Psr17Factory', '@Nyholm\Psr7\Factory\Psr17Factory', '@Nyholm\Psr7\Factory\Psr17Factory', '@Nyholm\Psr7\Factory\Psr17Factory']
    Symfony\Bridge\PsrHttpMessage\HttpMessageFactoryInterface: '@Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory'
    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'
    Psr\Log\LoggerInterface: '@logger'
    Symfony\Component\Serializer\SerializerInterface: '@serializer'
    Symfony\Contracts\Translation\TranslatorInterface: '@translator'
