# Enables the Symfony serializer and points mapping to platform-kernel resources.
framework:
    serializer:
        enabled: true
        mapping:
            paths: ['%kernel.project_dir%/vendor/crud-platform/platform-kernel/src/Resources/config/serializer']
        default_context:
            # Use a static handler to safely break circular references
            circular_reference_handler: 'App\Core\Serializer\CircularReferenceHandler::handle'
