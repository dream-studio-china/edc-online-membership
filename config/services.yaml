# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

parameters: {}

imports:
    - { resource: '../vendor/crud-platform/identity-app/config/services_identity.yaml' }
    - { resource: '../vendor/crud-platform/common-app/src/Storage/Resources/config/services_storage.yaml' }
    - { resource: '../vendor/crud-platform/identity-app/config/services_wechat.yaml' }

services:
    _defaults:
        autowire: true
        autoconfigure: true

    _instanceof:
        App\Core\Controller\RestController:
            calls:
                - [ setRequestStack, [ '@request_stack' ] ]
                - [ setSerializer, [ '@serializer' ] ]
                - [ setTranslator, [ '@translator' ] ]
                - [ setServiceContainer, [ '@service_container' ] ]
        App\Payment\Service\PaymentGatewayInterface:
            tags: ['payment.gateway']
        App\Payment\Service\Adjustment\PaymentAdjustmentProviderInterface:
            tags: ['payment.adjustment_provider']
        App\Storage\Service\MediaStorageInterface:
            tags: ['media.storage']
        App\Promotion\Strategy\PromotionStrategyInterface:
            tags: ['promotion.strategy']

    App\:
        resource: '../src/'

    App\Wallet\:
        resource: '../vendor/crud-platform/wallet-app/src/'
        exclude:
            - '../vendor/crud-platform/wallet-app/src/Kernel.php'

    App\Common\:
        resource: '../vendor/crud-platform/common-app/src/Main/'
        exclude:
            - '../vendor/crud-platform/common-app/src/Main/Kernel.php'

    App\Storage\:
        resource: '../vendor/crud-platform/common-app/src/Storage/'
        exclude:
            - '../vendor/crud-platform/common-app/src/Storage/Resources/'
            - '../vendor/crud-platform/common-app/src/Storage/Service/LocalStorage.php'
            - '../vendor/crud-platform/common-app/src/Storage/Service/QiniuStorage.php'

    App\Identity\Main\:
        resource: '../vendor/crud-platform/identity-app/src/Main/'
        exclude:
            - '../vendor/crud-platform/identity-app/src/Main/Kernel.php'
            - '../vendor/crud-platform/identity-app/src/Main/Controller/AuthController.php'
            - '../vendor/crud-platform/identity-app/src/Main/Controller/OtpController.php'
            - '../vendor/crud-platform/identity-app/src/Main/Security/TokenManager.php'
            - '../vendor/crud-platform/identity-app/src/Main/Sms/AliyunSmsProvider.php'
            - '../vendor/crud-platform/identity-app/src/Main/Service/RedisOtpStorage.php'

    App\Identity\Wechat\:
        resource: '../vendor/crud-platform/identity-app/src/Wechat/'
        exclude:
            - '../vendor/crud-platform/identity-app/src/Wechat/Service/WechatService.php'

    App\Store\:
        resource: '../vendor/crud-platform/store-app/src/'
        exclude:
            - '../vendor/crud-platform/store-app/src/Kernel.php'

    App\Inventory\:
        resource: '../vendor/crud-platform/inventory-app/src/'
        exclude:
            - '../vendor/crud-platform/inventory-app/src/Kernel.php'

    App\Payment\:
        resource: '../vendor/crud-platform/payment-app/src/'
        exclude:
            - '../vendor/crud-platform/payment-app/src/Kernel.php'

    App\Trade\:
        resource: '../vendor/crud-platform/trade-app/src/Trade/'
        exclude:
            - '../vendor/crud-platform/trade-app/src/Trade/Kernel.php'

    App\Promotion\:
        resource: '../vendor/crud-platform/trade-app/src/Promotion/'
        exclude:
            - '../vendor/crud-platform/trade-app/src/Promotion/Exception/*'
            - '../vendor/crud-platform/trade-app/src/Promotion/Resources/'

    App\Core\:
        resource: '../vendor/crud-platform/platform-kernel/src/'
        exclude:
            - '../vendor/crud-platform/platform-kernel/src/Serializer/Normalizer/FlatNormalizer.php'
            - '../vendor/crud-platform/platform-kernel/src/EventListener/*'

    App\Core\EventListener\OpenApiEnricherListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response, priority: -10 }

    App\Core\EventListener\AccessLogListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response, priority: -5 }

    App\Core\EventListener\LocaleListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 20 }

    Nyholm\Psr7\Factory\Psr17Factory: ~

    Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory:
        arguments:
            - '@Nyholm\Psr7\Factory\Psr17Factory'
            - '@Nyholm\Psr7\Factory\Psr17Factory'
            - '@Nyholm\Psr7\Factory\Psr17Factory'
            - '@Nyholm\Psr7\Factory\Psr17Factory'

    Symfony\Bridge\PsrHttpMessage\HttpMessageFactoryInterface: '@Symfony\Bridge\PsrHttpMessage\Factory\PsrHttpFactory'

    Symfony\Component\DependencyInjection\ContainerInterface: '@service_container'
    Psr\Log\LoggerInterface: '@logger'
    Symfony\Component\Serializer\SerializerInterface: '@serializer'
    Symfony\Contracts\Translation\TranslatorInterface: '@translator'
    App\Core\Service\ServiceLocatorInterface: '@App\Core\Service\DefaultServiceLocator'

    App\Identity\Main\Service\OtpStorageInterface: '@App\Identity\Main\Service\LocalCacheOtpStorage'
    App\Payment\Bridge\Wechat\WechatPayerOpenIdResolverInterface: '@App\Bridge\PaymentIdentity\WechatPayerOpenIdResolver'
    App\Payment\Bridge\Wallet\WalletBalanceAdjustmentPortInterface: '@App\Bridge\PaymentWallet\WalletBalanceAdjustmentPort'
    App\Payment\Service\Gateway\WechatPayService:
        arguments:
            $miniappAppId: '%env(WECHAT_MINIAPP_APP_ID)%'
            $miniappSecret: '%env(WECHAT_MINIAPP_SECRET)%'
            $payMchId: '%env(WECHAT_PAY_MCH_ID)%'
            $paySecretKey: '%env(WECHAT_PAY_SECRET_KEY)%'
            $payPrivateKeyPath: '%env(WECHAT_PAY_PRIVATE_KEY)%'
            $payCertificatePath: '%env(WECHAT_PAY_CERTIFICATE)%'
            $payPlatformCertPath: '%env(WECHAT_PAY_PLATFORM_CERT)%'
            $payPubKeyId: '%env(WECHAT_PAY_PUB_KEY_ID)%'
            $payPubKeyPath: '%env(WECHAT_PAY_PUB_KEY_PATH)%'

    App\Payment\Service\Gateway\WechatPayGateway:
        arguments:
            $notifyUrl: '%env(WECHAT_PAY_NOTIFY_URL)%'
    App\Trade\Service\StoreContextResolverInterface: '@App\Trade\Service\StoreContextResolver'
    App\Inventory\Service\MaterialServiceInterface: '@App\Inventory\Service\MaterialService'
    App\Inventory\Service\InventoryStockServiceInterface: '@App\Inventory\Service\InventoryStockService'
    App\Inventory\Service\SpecificationRecipeServiceInterface: '@App\Inventory\Service\SpecificationRecipeService'
    App\Inventory\Service\InventoryServiceInterface: '@App\Inventory\Service\InventoryService'

    App\Identity\Main\Service\LocalCacheOtpStorage:
        arguments:
            $cache: '@cache.app'

    App\Identity\Main\Service\OtpService:
        arguments:
            $storage: '@App\Identity\Main\Service\LocalCacheOtpStorage'
            $sms: '@App\Identity\Main\Sms\AliyunSmsProvider'

    App\Payment\Service\PayerReferenceResolverInterface: '@App\Bridge\IdentityPayment\IdentityPayerDirectoryReferenceResolver'
    App\Core\Security\IdentityUserIdResolverInterface: '@App\Bridge\Identity\IdentityUserIdResolver'
    App\Core\Security\UserUuidResolverInterface: '@App\Bridge\Identity\IdentityUserUuidResolver'
    CrudPlatform\IntegrationContracts\Wallet\WalletTransferPortInterface: '@App\Wallet\Service\WalletPaymentService'

when@test:
    services:
        App\Identity\Main\Service\OtpStorageInterface: '@App\Identity\Main\Service\NullOtpStorage'
        App\Identity\Main\Service\RedisOtpStorage: null
        App\Identity\Main\Service\OtpService:
            arguments:
                $storage: '@App\Identity\Main\Service\NullOtpStorage'
                $sms: '@App\Identity\Main\Sms\AliyunSmsProvider'
