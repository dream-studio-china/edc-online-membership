# mkdocs-zh.yml — Chinese documentation build (auto-translated from docs/)
#
# Usage:
#   pip install deep-translator
#   python scripts/translate-docs.py         # generate docs-zh/
#   mkdocs build -f mkdocs-zh.yml -d site/zh  # build Chinese site

site_name: CRUD Skeleton
site_description: Symfony 8.1 API 后端框架，包含模块化架构与可插拔业务模块
repo_url: https://github.com/immane/crud-skeleton
edit_uri: edit/dev/docs/
docs_dir: docs-zh
site_dir: site/zh

theme:
  name: material
  custom_dir: docs/overrides
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至亮色模式
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 设计契约:
      - 系统架构: design/system-architecture.md
      - API 设计: design/api-design.md
      - 数据模型: design/data-model.md
      - 模块设计: design/module-design.md
      - 控制器设计: design/controller-design.md
      - API 文档: design/api-documentation.md
      - 系统契约: design/system-contracts.md
  - 模块设计:
      - Core 框架: design/bundles/core.md
      - Common (CMS): design/bundles/common.md
      - Trade (电商): design/bundles/trade.md
      - Payment (支付): design/bundles/payment.md
      - Wallet (钱包): design/bundles/wallet.md
      - Identity (鉴权): design/bundles/identity.md
  - 调研:
      - EasyWeChat 6.x 用法: research/easywechat-6.x-usage.md
      - 汇付支付 API: research/huifu-payment-api.md
  - AI 快照: ai/context.md
  - API 参考: openapi/endpoints.yaml
