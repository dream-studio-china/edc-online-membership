services:
  app:
    environment:
      APP_ENV: dev
      APP_DEBUG: "1"
      # Dev fallback: use .env or .env.local's APP_SECRET, or this default
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      MAILER_DSN: smtp://mailer:1025
    volumes:
      - ./:/var/www/html

  store-app:
    volumes:
      - ./:/workspace

  inventory-app:
    volumes:
      - ./:/workspace

  trade-app:
    volumes:
      - ./:/workspace

  database:
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  store-database:
    ports:
      - "3307:3306"

  inventory-database:
    ports:
      - "3309:3306"

  payment-database:
    ports:
      - "3310:3306"

  trade-database:
    ports:
      - "3311:3306"

  mailer:
    ports:
      - "1025:1025"
