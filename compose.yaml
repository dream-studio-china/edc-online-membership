services:
  # ========================
  # Application (PHP-FPM)
  # ========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Symfony core (required)
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?required}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=16&charset=utf8"

      # JWT authentication (required)
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/var/www/html/var/jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/var/www/html/var/jwt_public.pem}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-7200}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-31536000}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?required}

      # OTP / SMS (optional — leave empty to disable)
      OTP_REDIS_DSN: ${OTP_REDIS_DSN:-redis://redis:6379/0}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID:-}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_REGION: ${ALIYUN_SMS_REGION:-cn-hangzhou}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_LOGIN_OTP: ${ALIYUN_SMS_TEMPLATE_LOGIN_OTP:-}
      ALIYUN_SMS_TEMPLATE_VERIFY_PHONE: ${ALIYUN_SMS_TEMPLATE_VERIFY_PHONE:-}
      ALIYUN_SMS_DRY_RUN: ${ALIYUN_SMS_DRY_RUN:-true}

      # WeChat Mini Program (optional)
      WECHAT_MINIAPP_APP_ID: ${WECHAT_MINIAPP_APP_ID:-}
      WECHAT_MINIAPP_SECRET: ${WECHAT_MINIAPP_SECRET:-}

      # WeChat Official Account (optional)
      WECHAT_OFFICIAL_APP_ID: ${WECHAT_OFFICIAL_APP_ID:-}
      WECHAT_OFFICIAL_SECRET: ${WECHAT_OFFICIAL_SECRET:-}
      WECHAT_OFFICIAL_TOKEN: ${WECHAT_OFFICIAL_TOKEN:-}
      WECHAT_OFFICIAL_AES_KEY: ${WECHAT_OFFICIAL_AES_KEY:-}

      # WeChat Pay V3 (optional)
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_SECRET_KEY: ${WECHAT_PAY_SECRET_KEY:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_CERTIFICATE: ${WECHAT_PAY_CERTIFICATE:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}

      # Infrastructure (defaults work out of the box)
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-doctrine://default?auto_setup=0}
      DEFAULT_URI: ${DEFAULT_URI:-http://localhost}

    volumes:
      - app_var:/var/www/html/var
      - ./var/jwt:/var/www/html/var/jwt:ro            # JWT keys
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal

  # ========================
  # Web Server (nginx)
  # ========================
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

  # ========================
  # Database (PostgreSQL 16)
  # ========================
  database:
    image: postgres:${POSTGRES_VERSION:-16}-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/postgresql/data:rw
    networks:
      - internal

  # ========================
  # Cache (Redis)
  # ========================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal

  # ========================
  # Email Testing (Mailpit)
  # ========================
  mailer:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - internal

networks:
  internal:

volumes:
  database_data:
  redis_data:
  app_var:
