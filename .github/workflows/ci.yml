name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        php: ['8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, pdo, pdo_pgsql, xdebug
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup test database
        run: |
          php bin/console doctrine:database:create --env=test --quiet --if-not-exists || true
          php bin/console doctrine:schema:update --env=test --force --quiet
        env:
          DATABASE_URL: "postgresql://app:app_secret@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"

      - name: Run tests with coverage
        run: |
          XDEBUG_MODE=coverage php bin/phpunit tests/ \
            --coverage-text \
            --display-deprecations \
            | tee /dev/stderr \
            | grep -i "Lines:" > /tmp/coverage_line.txt
          cat /tmp/coverage_line.txt

      - name: Check coverage threshold (80%)
        run: |
          COVERAGE=$(grep "^  Lines:" /tmp/coverage_line.txt | sed -E 's/.*Lines: *([0-9.]+)%.*/\1/')
          THRESHOLD=80.0
          echo "Line coverage: ${COVERAGE}%"
          if [ $(echo "${COVERAGE} < ${THRESHOLD}" | bc) -eq 1 ]; then
            echo "::error::Line coverage ${COVERAGE}% is below ${THRESHOLD}% threshold"
            exit 1
          fi
          echo "Line coverage ${COVERAGE}% meets 80% threshold"
