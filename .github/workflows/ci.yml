name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/deptrac.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check architecture boundaries
        run: composer deptrac

  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/phpstan.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan
        run: composer phpstan

  app-unit-tests:
    name: Unit tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret
      DATABASE_URL: "postgresql://app:app_secret@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"
      DEFAULT_URI: http://localhost
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: null://null
      JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/apps/identity/tests/Identity/Security/test_private.pem
      JWT_PUBLIC_KEY_PATH: ${{ github.workspace }}/apps/identity/tests/Identity/Security/test_public.pem
      JWT_PASSPHRASE: ""
      ACCESS_TOKEN_TTL: "7200"
      REFRESH_TOKEN_TTL: "31536000"
      REFRESH_TOKEN_SECRET: test_refresh_secret_key_32bytes
      OTP_TTL: "300"
      OTP_REDIS_DSN: redis://localhost:6379/0
      ALIYUN_ACCESS_KEY_ID: test_key
      ALIYUN_ACCESS_KEY_SECRET: test_secret
      ALIYUN_SMS_REGION: cn-hangzhou
      ALIYUN_SMS_SIGN_NAME: TestApp
      ALIYUN_SMS_TEMPLATE_LOGIN_OTP: SMS_001
      ALIYUN_SMS_TEMPLATE_VERIFY_PHONE: SMS_002
      ALIYUN_SMS_DRY_RUN: "true"

    strategy:
      matrix:
        app: [common, identity, inventory, payment, store, trade, wallet]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo, pdo_pgsql, xdebug
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/vendor
          key: app-${{ matrix.app }}-composer-8.4-${{ hashFiles(format('apps/{0}/composer.lock', matrix.app)) }}
          restore-keys: app-${{ matrix.app }}-composer-8.4-

      - name: Install dependencies
        run: composer install --working-dir=apps/${{ matrix.app }} --prefer-dist --no-progress --no-interaction

      - name: Run unit suite with coverage
        run: XDEBUG_MODE=coverage composer --working-dir=apps/${{ matrix.app }} test -- --coverage-php ../../build/coverage/raw/${{ matrix.app }}.cov --display-deprecations

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.app }}
          path: build/coverage/raw/${{ matrix.app }}.cov
          if-no-files-found: error

  root-tests:
    name: Root integration and remaining unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: test
      APP_SECRET: ci_test_secret
      DATABASE_URL: "postgresql://app:app_secret@127.0.0.1:5432/app_test?serverVersion=16&charset=utf8"
      DEFAULT_URI: http://localhost
      MESSENGER_TRANSPORT_DSN: "doctrine://default?auto_setup=0"
      MAILER_DSN: null://null
      JWT_PRIVATE_KEY_PATH: apps/identity/tests/Identity/Security/test_private.pem
      JWT_PUBLIC_KEY_PATH: apps/identity/tests/Identity/Security/test_public.pem
      JWT_PASSPHRASE: ""
      ACCESS_TOKEN_TTL: "7200"
      REFRESH_TOKEN_TTL: "31536000"
      REFRESH_TOKEN_SECRET: test_refresh_secret_key_32bytes
      OTP_TTL: "300"
      OTP_REDIS_DSN: redis://localhost:6379/0
      ALIYUN_ACCESS_KEY_ID: test_key
      ALIYUN_ACCESS_KEY_SECRET: test_secret
      ALIYUN_SMS_REGION: cn-hangzhou
      ALIYUN_SMS_SIGN_NAME: TestApp
      ALIYUN_SMS_TEMPLATE_LOGIN_OTP: SMS_001
      ALIYUN_SMS_DRY_RUN: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_secret
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo, pdo_pgsql, xdebug
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Setup test database
        run: |
          php bin/console doctrine:database:create --env=test --quiet --if-not-exists || true
          php bin/console doctrine:schema:update --env=test --force --quiet

      - name: Run root suite with coverage
        run: XDEBUG_MODE=coverage php -d memory_limit=512M vendor/bin/phpunit tests/ --coverage-php build/coverage/raw/root.cov --display-deprecations

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-root
          path: build/coverage/raw/root.cov
          if-no-files-found: error

  coverage:
    name: Aggregate coverage gate
    needs: [app-unit-tests, root-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: build/coverage/raw
          merge-multiple: true

      - name: Merge coverage and enforce line coverage
        run: composer coverage:merge

      - name: Upload aggregate coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-aggregate
          path: |
            build/coverage/clover.xml
            build/coverage/text.txt
          if-no-files-found: error

  rector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: "sqlite:///%kernel.project_dir%/var/rector.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ctype, iconv, pdo
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: composer-8.4-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Rector type rules (dry-run)
        run: composer rector:types:check
