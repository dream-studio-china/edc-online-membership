# ====================================================================
# Dynamic property (prefix/suffix patterns used before field names)
# These are concatenated: "{$field} is required." → "email is required."
# The full dynamic message is passed through ->trans() but the property
# name part ("email", "amount", etc.) is NOT separately translatable here.
# The " is required" suffix IS a separate entry defined above.
# However, full messages like "{$field} is required." and
# "The entity of key[%s] is not found" are handled below.
# ====================================================================
"The entity of key[%s] is not found": "The entity of key[%s] is not found"

