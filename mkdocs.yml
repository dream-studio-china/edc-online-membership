site_name: CRUD Platform
site_description: A production-oriented Symfony microservices platform evolved from modular monolith architecture, featuring DDD, service isolation, and event-driven communication.
repo_url: https://github.com/immane/crud-platform
edit_uri: edit/dev/docs/
site_dir: site
site_url: https://immane.github.io/crud-platform/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Design Contracts:
      - System Architecture: design/system-architecture.md
      - Microservice Transition: design/microservice-transition.md
      - Store Extraction Readiness: design/store-extraction-readiness.md
      - Inventory Extraction Readiness: design/inventory-extraction-readiness.md
      - Payment Extraction Readiness: design/payment-extraction-readiness.md
      - Wallet Extraction Readiness: design/wallet-extraction-readiness.md
      - API Design: design/api-design.md
      - Data Model: design/data-model.md
      - Module Design: design/module-design.md
      - Controller Design: design/controller-design.md
      - API Documentation: design/api-documentation.md
      - System Contracts: design/system-contracts.md
  - Bundles:
      - Core Framework: design/bundles/core.md
      - Common (CMS): design/bundles/common.md
      - Trade (E-Commerce): design/bundles/trade.md
      - Store (Multi-Store Operations): design/bundles/store.md
      - Inventory: design/bundles/inventory.md
      - Payment: design/bundles/payment.md
      - Wallet: design/bundles/wallet.md
      - Identity (Auth): design/bundles/identity.md
      - Wechat (Login + Pay): design/bundles/wechat.md
  - Research:
      - EasyWeChat 6.x Usage: research/easywechat-6.x-usage.md
      - Huifu Payment API: research/huifu-payment-api.md
  - Issues:
      - Architecture Review 2026-06-26: issues/architecture-review-2026-06-26.md
  - Development Manual:
      - Overview: manual/index.md
      - Architecture: manual/architecture.md
      - Getting Started: manual/getting-started.md
      - Project Structure: manual/project-structure.md
      - Core Framework: manual/core-framework.md
      - Core Usage: manual/core-usage.md
      - Query System: manual/query-system.md
      - Development Workflow: manual/development-workflow.md
      - Testing: manual/testing.md
      - API Contracts: manual/api-contracts.md
      - Development Contracts: manual/development-contracts.md
      - Integration Events: manual/integration-events.md
      - Database & Migrations: manual/database-and-migrations.md
      - Deployment: manual/deployment.md
      - Extracting a Service: manual/extracting-a-service.md
      - Internationalization: manual/i18n.md
  - AI Context: ai/context.md
